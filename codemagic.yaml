workflows:
  ios-verify:
    name: iOS unsigned build and tests
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Validate project structure
        script: python3 scripts/validate_project.py
      - name: Build for iPhone without signing
        script: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild -project ThreeMoments.xcodeproj -scheme ThreeMoments -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/logs/device-build.log
      - name: Run XCTest on an available iPhone simulator
        script: |
          mkdir -p build/logs
          set -o pipefail
          xcode-project run-tests --project ThreeMoments.xcodeproj --scheme ThreeMoments --output-dir build/ios/test 2>&1 | tee build/logs/simulator-tests.log
        test_report: build/ios/test/*.xml
    artifacts:
      - build/logs/*.log
      - build/ios/test/**/*
